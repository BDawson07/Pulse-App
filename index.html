<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pulse — Fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<meta name="application-name" content="Pulse">
<meta name="theme-color" content="#e9e6f5">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --font: ui-rounded, -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --text:#0b0b12; --text2:rgba(20,20,35,.66); --text3:rgba(20,20,35,.44);
  --glass-bg:rgba(255,255,255,.52); --glass-bg2:rgba(255,255,255,.38); --glass-strong:rgba(255,255,255,.74);
  --glass-border:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.95); --glass-lo:rgba(255,255,255,.25);
  --fill:rgba(120,120,140,.12); --fill2:rgba(120,120,140,.2); --sep:rgba(60,60,80,.14);
  --shadow:rgba(40,30,90,.14);
  --accent:#0A84FF; --accent-ink:#fff;
  --cardio:#FF375F; --lift:#24A148; --dist:#0A84FF;
  --warm:#E8890C; --work:#0A84FF; --fail:#E5262B; --pr:#C98A00;
  --ok:#24A148; --danger:#E5262B;
  --tab-h:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --spring:cubic-bezier(.34,1.36,.64,1); --ios:cubic-bezier(.32,.72,0,1);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --dark:1 } }
:root[data-theme="dark"], :root.dark{
  --text:#f5f5fa; --text2:rgba(235,235,245,.68); --text3:rgba(235,235,245,.42);
  --glass-bg:rgba(36,36,48,.48); --glass-bg2:rgba(50,50,66,.4); --glass-strong:rgba(44,44,58,.82);
  --glass-border:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22); --glass-lo:rgba(255,255,255,.04);
  --fill:rgba(140,140,170,.16); --fill2:rgba(140,140,170,.26); --sep:rgba(255,255,255,.1);
  --shadow:rgba(0,0,0,.4);
  --lift:#27AE4C; --warm:#FF9F0A; --fail:#FF453A; --pr:#FFCC00; --ok:#30C85A; --danger:#FF453A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:var(--font);color:var(--text);background:#e9e6f5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow:hidden;font-size:16px;line-height:1.35}
.dark body{background:#07070d}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font-size:16px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- animated mesh background ---------- */
#bg{position:fixed;inset:-20%;z-index:0;overflow:hidden;pointer-events:none}
#bg .b{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.75;will-change:transform}
#bg .b1{background:radial-gradient(circle,#ff6b9a 0,#ff6b9a00 70%);left:-10%;top:-5%;animation:drift1 38s ease-in-out infinite alternate}
#bg .b2{background:radial-gradient(circle,#7c5cff 0,#7c5cff00 70%);right:-15%;top:10%;animation:drift2 44s ease-in-out infinite alternate}
#bg .b3{background:radial-gradient(circle,#2fb8ff 0,#2fb8ff00 70%);left:5%;bottom:-15%;animation:drift3 50s ease-in-out infinite alternate}
#bg .b4{background:radial-gradient(circle,#3ee0b0 0,#3ee0b000 70%);right:0;bottom:0;width:45vmax;height:45vmax;animation:drift1 56s ease-in-out infinite alternate-reverse}
.dark #bg .b{opacity:.42}
@keyframes drift1{to{transform:translate3d(18vmax,22vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-22vmax,18vmax,0) scale(.9)}}
@keyframes drift3{to{transform:translate3d(16vmax,-20vmax,0) scale(1.2)}}

/* ---------- glass ---------- */
.glass{position:relative;background:var(--glass-bg);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--glass-border);border-radius:26px;
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px var(--glass-lo),0 10px 30px -8px var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.5) 0,rgba(255,255,255,0) 32%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18) 100%);opacity:.55}
.dark .glass::before{opacity:.18}
.inset{background:var(--fill);border-radius:16px}

/* ---------- layout ---------- */
#app{position:fixed;inset:0;z-index:1}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + var(--tab-h) + 40px);display:none;overscroll-behavior:contain}
.view.on{display:block}
.view.enter-r{animation:enterR .5s var(--spring) both}
.view.enter-l{animation:enterL .5s var(--spring) both}
@keyframes enterR{from{opacity:0;transform:translate3d(28px,0,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes enterL{from{opacity:0;transform:translate3d(-28px,0,0) scale(.985)}to{opacity:1;transform:none}}
.wrap{max-width:640px;margin:0 auto}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text2)}
.ltitle{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;line-height:1.1}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec{font-size:20px;font-weight:700;margin:24px 4px 10px;display:flex;align-items:center;justify-content:space-between}
.sec small{font-size:15px;font-weight:600;color:var(--accent)}
.card{padding:16px;margin-bottom:12px}
.muted{color:var(--text2)} .faint{color:var(--text3)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:10px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stagger>*{animation:fadeUp .55s var(--spring) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes fadeUp{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;min-height:48px;padding:0 18px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:650;font-size:17px;
  background:var(--fill);transition:transform .18s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px -8px var(--accent)}
.btn.danger{color:var(--danger)}
.btn.dangerfill{background:var(--danger);color:#fff}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:36px;font-size:15px;padding:0 12px;border-radius:12px}
.btn.glassbtn{background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-border);box-shadow:inset 0 1px 0 var(--glass-hi)}
.iconbtn{position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--fill);transition:transform .18s var(--spring);flex:none}
.iconbtn:active{transform:scale(.9)}
.link{color:var(--accent);font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.18;transform:scale(0);animation:ripple .6s ease-out forwards}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* segmented */
.seg{display:flex;padding:3px;border-radius:14px;background:var(--fill);position:relative}
.seg button{flex:1;min-height:38px;border-radius:11px;font-weight:600;font-size:15px;position:relative;z-index:1;color:var(--text2);transition:color .25s}
.seg button.on{color:var(--text)}
.seg .sthumb{position:absolute;top:3px;bottom:3px;left:3px;border-radius:11px;background:var(--glass-strong);box-shadow:0 2px 8px var(--shadow),inset 0 1px 0 var(--glass-hi);transition:transform .45s var(--spring),width .3s var(--ios);z-index:0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;background:var(--fill);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .2s var(--spring),background .2s}
.chip.on{background:var(--text);color:var(--glass-strong)}
.dark .chip.on{color:#111}
.chip:active{transform:scale(.94)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700;background:var(--fill)}
.tag.pr{background:color-mix(in srgb,var(--pr) 22%,transparent);color:var(--pr)}
.dark .tag.pr{color:var(--pr)}

/* ---------- tab bar ---------- */
#tabbar{position:fixed;z-index:30;left:50%;bottom:calc(var(--sab) + 10px);transform:translateX(-50%);width:min(calc(100% - 24px),460px);height:var(--tab-h);
  display:flex;padding:6px;border-radius:32px}
#tabbar .ind{position:absolute;top:6px;bottom:6px;left:6px;border-radius:26px;background:var(--fill2);box-shadow:inset 0 1px 0 var(--glass-hi);transition:transform .55s var(--spring);will-change:transform}
#tabbar button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:650;color:var(--text2);border-radius:26px;transition:color .25s}
#tabbar button svg{width:24px;height:24px;transition:transform .45s var(--spring)}
#tabbar button.on{color:var(--accent)}
#tabbar button.on svg{transform:scale(1.1) translateY(-1px)}
#tabbar button .dot{position:absolute;top:7px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--cardio);display:none;animation:pulse 1.6s ease-in-out infinite}
#tabbar button .dot.show{display:block}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.sheet-wrap.open .sheet-back{opacity:1}
.sheet{position:relative;width:100%;max-width:640px;max-height:calc(100% - var(--sat) - 28px);display:flex;flex-direction:column;border-radius:30px 30px 0 0;border-bottom:0;
  background:var(--glass-strong);transform:translate3d(0,105%,0);transition:transform .5s var(--ios);will-change:transform;padding-bottom:var(--sab)}
.sheet.full{height:calc(100% - var(--sat) - 28px)}
.sheet-wrap.open .sheet{transform:none}
.sheet .grab{flex:none;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none}
.sheet .grab::after{content:"";width:38px;height:5px;border-radius:3px;background:var(--text3)}
.sheet .sh{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px 10px;touch-action:none}
.sheet .sh h2{flex:1;margin:0;font-size:20px;font-weight:750;min-width:0}
.sheet .sb{flex:1;overflow-y:auto;padding:4px 16px 20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet .sf{flex:none;padding:10px 16px 12px;border-top:1px solid var(--sep)}

/* dialog */
.dlg-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(0,0,0,.25);animation:fadeIn .2s both}
.dlg{width:100%;max-width:320px;padding:20px 18px 14px;text-align:center;animation:pop .4s var(--spring) both;background:var(--glass-strong)}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0 0 16px;color:var(--text2);font-size:15px}
.dlg .row{gap:8px}.dlg .btn{flex:1}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.85)}}

/* toast */
#toasts{position:fixed;z-index:90;left:0;right:0;top:calc(var(--sat) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:20px;font-weight:600;font-size:15px;max-width:92%;animation:toastIn .5s var(--spring) both;background:var(--glass-strong)}
.toast.out{animation:toastOut .3s ease-in both}
@keyframes toastIn{from{opacity:0;transform:translate3d(0,-20px,0) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translate3d(0,-14px,0) scale(.95)}}

/* ---------- forms ---------- */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:0 4px 6px}
.input{width:100%;min-height:46px;border-radius:14px;border:1px solid transparent;background:var(--fill);padding:10px 14px;outline:none;transition:border-color .2s,background .2s}
.input:focus{border-color:var(--accent);background:var(--glass-strong)}
textarea.input{min-height:80px;resize:vertical}
.list{border-radius:20px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;position:relative;overflow:hidden;width:100%;text-align:left}
.li+.li{border-top:1px solid var(--sep)}
.li .grow b{display:block;font-weight:650}
.li .grow small{display:block;color:var(--text2);font-size:13px}
.switch{position:relative;width:52px;height:32px;border-radius:16px;background:var(--fill2);transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .4s var(--spring)}
.switch.on{background:var(--ok)}
.switch.on::after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:64px;text-align:center}

/* ---------- home ---------- */
.rings{display:flex;align-items:center;gap:18px}
.rings svg{width:132px;height:132px;flex:none;transform:rotate(-90deg)}
.rings circle{fill:none;stroke-linecap:round}
.rings .trk{opacity:.18}
.rings .arc{transition:stroke-dashoffset 1.4s var(--ios)}
.legend .lg{display:flex;align-items:baseline;gap:8px;margin:6px 0}
.legend .sw{width:10px;height:10px;border-radius:50%;flex:none;transform:translateY(-1px)}
.legend .v{font-size:20px;font-weight:750}
.legend .t{font-size:13px;color:var(--text2)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px 14px;border-radius:18px;background:var(--fill)}
.stat .k{font-size:12px;font-weight:650;color:var(--text2);text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-size:24px;font-weight:750;margin-top:2px}
.stat .v small{font-size:14px;font-weight:600;color:var(--text2);margin-left:2px}
.streak{display:flex;align-items:center;gap:14px}
.flame{width:52px;height:52px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#FF9F0A,#FF375F);color:#fff;flex:none;box-shadow:0 8px 20px -8px #FF375F}
.flame svg{width:28px;height:28px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.quick .btn{min-height:58px;border-radius:20px;justify-content:flex-start;padding:0 14px;white-space:nowrap}
.qi{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dw{font-size:11px;font-weight:700;color:var(--text3);padding:4px 0}
.cal .d{position:relative;aspect-ratio:1/1.05;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;transition:transform .2s var(--spring)}
.cal .d:active{transform:scale(.9)}
.cal .d.out{opacity:0;pointer-events:none}
.cal .d.today{background:var(--accent);color:#fff}
.cal .d.has{background:var(--fill)}
.cal .d.today.has{background:var(--accent)}
.cal .dots{display:flex;gap:3px;height:6px;margin-top:2px}
.cal .dots i{width:5px;height:5px;border-radius:50%}
.feed .li{min-height:64px}
.aicon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.aicon.run,.aicon.walk,.aicon.bike{background:linear-gradient(160deg,#ff6b8a,var(--cardio))}
.aicon.lift{background:linear-gradient(160deg,#4cd47a,var(--lift))}
.thumb{width:64px;height:64px;border-radius:14px;flex:none;background:var(--fill);overflow:hidden}
.thumb>svg{width:100%;height:100%}

/* ---------- cardio ---------- */
.typeseg{margin-bottom:14px}
.mapbox{position:relative;height:300px;border-radius:24px;overflow:hidden;margin-bottom:12px;
  background-color:var(--fill);background-image:linear-gradient(var(--sep) 1px,transparent 1px),linear-gradient(90deg,var(--sep) 1px,transparent 1px);background-size:28px 28px}
.mapbox.small{height:220px}
.mapbox .leaflet-container{background:transparent!important}
.mapbox svg.fallback{position:absolute;inset:0;width:100%;height:100%}
.mapbox .overlay{position:absolute;left:10px;top:10px;z-index:500;display:flex;gap:6px}
.gpschip{padding:5px 10px;border-radius:12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;background:var(--glass-strong)}
.gpschip i{width:8px;height:8px;border-radius:50%;background:var(--text3)}
.gpschip.good i{background:var(--ok)} .gpschip.fair i{background:var(--warm)} .gpschip.bad i{background:var(--danger)}
.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.6)}
.bigtime{font-size:64px;font-weight:800;letter-spacing:-.03em;text-align:center;line-height:1;margin:6px 0 2px}
.bigsub{text-align:center;color:var(--text2);font-weight:600;font-size:14px;margin-bottom:12px}
.lstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.lstats .stat .v{font-size:30px}
.ctrls{display:flex;gap:14px;justify-content:center;align-items:center;margin:8px 0 18px}
.round{position:relative;overflow:hidden;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .2s var(--spring);font-weight:700}
.round:active{transform:scale(.92)}
.round svg{width:34px;height:34px}
.round.go{background:linear-gradient(160deg,#4cd47a,#1f9d45);box-shadow:0 12px 28px -10px #1f9d45}
.round.pause{background:linear-gradient(160deg,#ffc04d,#f08c00);box-shadow:0 12px 28px -10px #f08c00}
.round.stop{background:linear-gradient(160deg,#ff6b6b,#e0282e);box-shadow:0 12px 28px -10px #e0282e}
.startbtn{width:132px;height:132px;font-size:22px;flex-direction:column;gap:2px;margin:6px auto 12px}
.startbtn svg{width:40px;height:40px}
.startbtn::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid #24A14855;animation:halo 2.4s ease-out infinite}
@keyframes halo{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
.splits .sp{display:grid;grid-template-columns:34px 1fr 64px;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.splits .bar{height:12px;border-radius:2px 6px 6px 2px;background:var(--cardio);transform-origin:left;animation:grow .9s var(--ios) both}
.splits .bar.best{background:var(--pr)}
@keyframes grow{from{transform:scaleX(0)}}
.notice{padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--warm) 16%,transparent);font-size:15px;margin-bottom:12px}
.notice b{display:block;margin-bottom:4px}

/* ---------- lift ---------- */
.wohead{position:sticky;top:calc(-1 * var(--sat) - 14px);z-index:5;margin:calc(-1 * var(--sat) - 14px) -16px 12px;padding:calc(var(--sat) + 10px) 16px 10px;border-radius:0 0 24px 24px;border-top:0}
.wohead .title{font-size:24px;font-weight:800;background:transparent;border:0;outline:none;width:100%;padding:0;min-height:36px}
.wohead .clock{font-size:15px;font-weight:650;color:var(--text2)}
.ex{padding:14px 12px 10px;margin-bottom:12px}
.ex .exh{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
.ex .exh .nm{flex:1;min-width:0;font-weight:750;font-size:17px;color:var(--accent);text-align:left;min-height:44px;display:flex;align-items:center}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px 8px}
.ex .note{width:100%;margin:0 0 8px}
.sets .hd,.sets .sr{display:grid;grid-template-columns:46px minmax(0,1fr) 72px 60px 46px;gap:6px;align-items:center}

const Store = {

/* ================= strength metrics ================= */
const epley = (w, r) => !w || !r ? 0 : r === 1 ? w : w * (1 + r / 30);
const isUniSet = s => s.wL != null || s.rL != null || s.wR != null || s.rR != null;
function setE1RM(s, uni) { return uni ? Math.max(epley(s.wL, s.rL), epley(s.wR, s.rR)) : epley(s.w, s.r); }
function setMaxW(s, uni) { return uni ? Math.max(s.wL || 0, s.wR || 0) : (s.w || 0); }
function setMaxR(s, uni) { return uni ? Math.max(s.rL || 0, s.rR || 0) : (s.r || 0); }
function setVol(s, uni) { if (s.type === 'warmup') return 0; return uni ? (s.wL || 0) * (s.rL || 0) + (s.wR || 0) * (s.rR || 0) : (s.w || 0) * (s.r || 0); }
function exVol(ex) { return ex.sets.reduce((a, s) => a + (s.done !== false ? setVol(s, ex.uni) : 0), 0); }
function woVol(w) { return w.exercises.reduce((a, e) => a + exVol(e), 0); }
const finishedWorkouts = () => Object.values(Store.data.workouts).sort((a, b) => b.start - a.start);
function exHistory(exId, excludeId) {
  const out = [];
  for (const w of finishedWorkouts()) { if (w.id === excludeId) continue; for (const e of w.exercises) if (e.exId === exId) out.push({ w, e }); }
  return out;
}
function bestOf(exId, { before = Infinity, excludeId } = {}) {
  let e1 = 0, wt = 0, reps = 0, vol = 0, n = 0;
  for (const { w, e } of exHistory(exId, excludeId)) {
    if (w.start >= before) continue; n++;
    let v = 0;
    for (const s of e.sets) { if (s.type === 'warmup') continue; e1 = Math.max(e1, setE1RM(s, e.uni)); wt = Math.max(wt, setMaxW(s, e.uni)); if (!setMaxW(s, e.uni)) reps = Math.max(reps, setMaxR(s, e.uni)); v += setVol(s, e.uni); }
    vol = Math.max(vol, v);
  }
  return { e1, wt, reps, vol, n };
}
function computePRs(w) {
  const prs = [];
  for (const e of w.exercises) {
    const b = bestOf(e.exId, { before: w.start, excludeId: w.id }); if (!b.n) continue;
    let e1 = 0, wt = 0, reps = 0;
    for (const s of e.sets) { if (s.type === 'warmup') continue; e1 = Math.max(e1, setE1RM(s, e.uni)); wt = Math.max(wt, setMaxW(s, e.uni)); if (!setMaxW(s, e.uni)) reps = Math.max(reps, setMaxR(s, e.uni)); }
    if (e1 > b.e1 + 1e-6 && e1 > 0) prs.push({ exId: e.exId, kind: 'e1rm', v: e1 });
    if (wt > b.wt + 1e-6 && wt > 0) prs.push({ exId: e.exId, kind: 'weight', v: wt });
    if (!wt && reps > b.reps && reps > 0) prs.push({ exId: e.exId, kind: 'reps', v: reps });
  }
  return prs;
}
const prLabel = p => p.kind === 'e1rm' ? `e1RM ${fmtW(p.v)} ${wU()}` : p.kind === 'weight' ? `Heaviest ${fmtW(p.v)} ${wU()}` : `${p.v} reps`;
const TYPE_LABEL = { warmup: 'Warm-up', working: 'Working', failure: 'Failure' };
const newSet = (type = 'working') => ({ id: uid(), type, w: null, r: null, done: false });

const Rest = {
  end: 0, total: 0, t: null,
  node() { return $('#rest'); },
  start(sec) {
    this.total = sec; this.end = Date.now() + sec * 1000;
    const n = this.node(); n.classList.remove('done'); n.classList.add('show');
    clearInterval(this.t); this.t = setInterval(() => this.tick(), 250); this.tick();
  },
  add(d) { if (!this.end) return; this.end += d * 1000; this.total = Math.max(this.total + d, (this.end - Date.now()) / 1000, 1); this.tick(); },
  stop() { clearInterval(this.t); this.t = null; this.end = 0; this.node().classList.remove('show', 'done'); },
  tick() {
    const n = this.node(), rem = Math.max(0, (this.end - Date.now()) / 1000);
    $('.tm', n).textContent = fmtDur(Math.ceil(rem));
    const c = $('.arc', n), L = 2 * Math.PI * 22; c.style.strokeDasharray = L; c.style.strokeDashoffset = (L * (1 - rem / this.total)).toFixed(2);
    if (rem <= 0) {
      clearInterval(this.t); this.t = null; n.classList.add('done'); $('.tm', n).textContent = 'Rest over';
      beep(880, .15); beep(880, .15, .25); beep(1175, .3, .5); buzz([200, 100, 200]);
      setTimeout(() => { if (!this.t) this.stop(); }, 3500);
    }
  }
};

      ...(i > 0 ? [{ label: 'Move up', icon: 'up', fn: () => { d.exercises.splice(i, 1); d.exercises.splice(i - 1, 0, x); this.restructure(); } }] : []),
      ...(i < d.exercises.length - 1 ? [{ label: 'Move down', icon: 'down', fn: () => { d.exercises.splice(i, 1); d.exercises.splice(i + 1, 0, x); this.restructure(); } }] : []),

      { label: 'Remove exercise', icon: 'trash', danger: true, fn: async () => { if (x.sets.some(s => s.done) && !(await dialog({ title: 'Remove exercise?', msg: 'Its logged sets will be removed from this workout.', ok: 'Remove', danger: true }))) return; d.exercises.splice(d.exercises.indexOf(x), 1); this.restructure(); } },
    ]);

  toggleUni(x) {
    x.uni = !x.uni;

      if (x.uni) { s.wL = s.wR = s.w ?? null; s.rL = s.rR = s.r ?? null; if (s.t) { s.t.wL = s.t.wR = s.t.w; s.t.rL = s.t.rR = s.t.r; } }
      else { s.w = s.wL ?? s.wR ?? null; s.r = s.rL ?? s.rR ?? null; delete s.wL; delete s.wR; delete s.rL; delete s.rR; if (s.t) { s.t.w = s.t.wL ?? s.t.w; s.t.r = s.t.rL ?? s.t.r; } }

    $('[data-def]', sh.body).onclick = () => { x.rest = null; sh.close(); this.restructure(); };
    $('[data-ok]', sh.body).onclick = () => { x.rest = v; sh.close(); this.restructure(); };
  }
  addExercises(ids) {
    for (const id of ids) {
      const e = exById(id), prev = this.prevFor(id);
      const n = prev ? Math.max(1, Math.min(prev.sets.length, 8)) : 3;
      const sets = Array.from({ length: n }, (_, k) => newSet(prev && prev.sets[k] ? prev.sets[k].type : 'working'));
      this.doc.exercises.push({ uid: uid(), exId: id, uni: prev ? !!prev.uni : !!e.uni, notes: '', rest: null, sets });
    }
    this.restructure();
    setTimeout(() => { const last = this.root.lastElementChild; last && last.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'center' }); }, 60);
  }
}

function workoutToTemplate(w, name) {

    exercises: w.exercises.map(x => ({ exId: x.exId, uni: x.uni, notes: x.notes || '', rest: x.rest || null, sets: x.sets.map(s => ({ type: s.type, w: s.w ?? null, r: s.r ?? null, ...(x.uni ? { wL: s.wL ?? null, rL: s.rL ?? null, wR: s.wR ?? null, rR: s.rR ?? null } : {}) })) }))
  };
}
function templateToWorkout(t) {

    exercises: t.exercises.map(x => ({ uid: uid(), exId: x.exId, uni: x.uni, notes: x.notes || '', rest: x.rest || null, sets: x.sets.map(s => { const tg = {}; for (const k of ['w', 'r', 'wL', 'rL', 'wR', 'rR']) if (s[k] != null) tg[k] = s[k]; return { id: uid(), type: s.type, w: null, r: null, ...(x.uni ? { wL: null, rL: null, wR: null, rR: null } : {}), done: false, t: tg }; }) }))

async function saveAsTemplate(w) {

function editTemplate(t) {

function ringsSVG(goals) {

}
function streaks(acts) {
  const days = new Set(acts.map(a => dayKey(a.t)));
  let cur = 0; let t = startOfDay(Date.now());
  if (!days.has(dayKey(t))) t -= DAY;
  while (days.has(dayKey(t))) { cur++; t = startOfDay(t - DAY / 2); }
  const sorted = [...days].sort(); let best = 0, run = 0, prev = null;
  for (const k of sorted) { const tt = new Date(k + 'T12:00').getTime(); run = prev != null && Math.round((tt - prev) / DAY) === 1 ? run + 1 : 1; best = Math.max(best, run); prev = tt; }

}

  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data: json }); toast('Backup saved'); return; }
  } catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('A save prompt is already open'); return; } }
  try {
    const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    if (inClaudeFrame()) setTimeout(showBackupText, 600); else toast('Backup downloaded');
  } catch (e) { showBackupText(); }
}
function showBackupText() {
  const sh = openSheet({ title: 'Backup JSON', body: `<p class="muted" style="margin-top:0">If the download didn't start, copy this text and keep it somewhere safe (Notes, Files). You can paste it into Import later.</p><textarea class="input" readonly style="min-height:220px;font-size:12px;font-family:ui-monospace,Menlo,monospace">${esc(backupJSON())}</textarea><button class="btn primary block" data-c style="margin-top:10px">${ic('copy')} Copy</button>` });
  $('[data-c]', sh.body).onclick = async () => { const ta = $('textarea', sh.body); try { await navigator.clipboard.writeText(ta.value); toast('Copied'); } catch (e) { ta.focus(); ta.select(); toast('Selected — use Copy from the menu'); } };
}
function importSheet() {
  const sh = openSheet({ title: 'Import backup', body: `<p class="muted" style="margin-top:0">Choose a Pulse JSON backup, or paste its contents.</p><button class="btn primary block" data-pick>${ic('upload')} Choose file</button><label class="field" style="margin-top:14px"><span>Or paste JSON</span><textarea class="input" data-txt style="min-height:120px;font-size:13px;font-family:ui-monospace,Menlo,monospace"></textarea></label><button class="btn block" data-paste>Import pasted text</button>` });
  const file = $('[data-file]', SettingsView.node);
  $('[data-pick]', sh.body).onclick = () => { file.value = ''; file.click(); };
  file.onchange = async () => { const f = file.files[0]; if (!f) return; const txt = await f.text(); if (await applyImport(txt)) sh.close(); };
  $('[data-paste]', sh.body).onclick = async () => { if (await applyImport($('[data-txt]', sh.body).value)) sh.close(); };
}
async function applyImport(txt) {
  let obj; try { obj = JSON.parse(txt); } catch (e) { toast('That is not valid JSON'); return false; }
  const d = obj && obj.data ? obj.data : obj;
  if (!d || typeof d !== 'object' || !('cardio' in d || 'workouts' in d || 'templates' in d)) { toast('Not a Pulse backup'); return false; }
  const nC = Object.keys(d.cardio || {}).length, nW = Object.keys(d.workouts || {}).length;
  const replace = await dialog({ title: 'Import backup', msg: `${nC} cardio and ${nW} workouts found. Replace everything, or merge with what's here?`, ok: 'Replace', cancel: 'Merge' });
  const cur = Store.data;
  const next = replace ? { settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) }, customExercises: d.customExercises || [], templates: d.templates || [], cardio: d.cardio || {}, workouts: d.workouts || {} }
    : { settings: cur.settings, customExercises: mergeById(cur.customExercises, d.customExercises), templates: mergeById(cur.templates, d.templates), cardio: { ...cur.cardio, ...(d.cardio || {}) }, workouts: { ...cur.workouts, ...(d.workouts || {}) } };
  replaceAll(next); toast(`Imported ${nC} cardio · ${nW} workouts`); return true;
}
const mergeById = (a = [], b = []) => { const m = new Map(a.map(x => [x.id, x])); for (const x of b || []) m.set(x.id, x); return [...m.values()]; };
function replaceAll(next) {
  const d = Store.data;
  for (const id in d.cardio) if (!next.cardio[id]) Store.touch('c_' + id);
  for (const id in d.workouts) if (!next.workouts[id]) Store.touch('w_' + id);
  const oldC = d.cardio, oldW = d.workouts;
  Object.assign(d, next); _exCache.clear();
  for (const id in oldC) if (!next.cardio[id]) Store.dirty.add('c_' + id);
  for (const id in oldW) if (!next.workouts[id]) Store.dirty.add('w_' + id);
  for (const id in d.cardio) Store.touch('c_' + id);
  for (const id in d.workouts) Store.touch('w_' + id);
  Store.touch('meta', { now: true }); applyTheme(); renderAll();
}

/* ================= theme & boot ================= */
const mqDark = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S().theme, dark = t === 'dark' || (t === 'system' && mqDark.matches);
  document.documentElement.classList.toggle('dark', dark);
  const meta = $('meta[name="theme-color"]'); if (meta) meta.content = dark ? '#07070d' : '#e9e6f5';
}
mqDark.addEventListener?.('change', applyTheme);
const Views = { home: Home, cardio: CardioView, lift: LiftView, history: HistoryView, settings: SettingsView };
function renderAll(keys) { const t = Tabs.cur; if (keys && keys.size && [...keys].every(k => k === 'active')) { if (t === 'lift') LiftView.progress(); Tabs.badge(); return; } if (t && Views[t]) { if (t === 'lift' && Store.data.active.lift && LiftView.editor && $('[data-ed]', LiftView.node)) { LiftView.progress(); return; } if (t === 'cardio' && Tracker.s) { CardioView.updateLive(); return; } Views[t].render(); } Tabs.badge(); }

function boot() {
  Store.loadLocal(); applyTheme();
  document.body.insertAdjacentHTML('beforeend', `<div id="rest" class="glass" role="timer" aria-live="polite"><div class="rr"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" stroke="var(--fill2)"/><circle class="arc" cx="26" cy="26" r="22" stroke="var(--accent)" stroke-linecap="round" style="transition:stroke-dashoffset .25s linear"/></svg><div class="t">${ic('timer').replace('class="i ', 'style="width:18px;height:18px" class="i ')}</div></div><div class="grow"><div class="faint" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em">Rest</div><div class="tm num">0:00</div></div><button class="iconbtn" data-r="-15" aria-label="Subtract 15 seconds" style="font-weight:800;font-size:13px">−15</button><button class="iconbtn" data-r="15" aria-label="Add 15 seconds" style="font-weight:800;font-size:13px">+15</button><button class="btn sm primary" data-r="skip">Skip</button></div>`);
  $('#rest').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (!b) return; b.dataset.r === 'skip' ? Rest.stop() : Rest.add(+b.dataset.r); });
  Tracker.restore();
  Tabs.build();
  let first = lsGet('pulse.tab'); if (!Views[first]) first = 'home';
  if (Tracker.s) first = 'cardio'; else if (Store.data.active.lift && first !== 'lift') first = 'lift';
  Tabs.go(first); Tabs.badge();
  Store.on((full, keys) => { if (full) { _exCache.clear(); applyTheme(); if (Tracker.s == null) Tracker.restore(); if (Tabs.cur === 'lift' && Store.data.active.lift) { LiftView.render(); Tabs.badge(); return; } } renderAll(full ? null : keys); });
  loadLeaflet();
  setTimeout(() => Store.initCloud(), 0);
  addEventListener('pagehide', () => { if (Tracker.s) Tracker.persist(true); Store.saveLocal(); });
  addEventListener('resize', () => Tabs.place());
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !inClaudeFrame()) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW failed', e)));
}

</script>
